name: Build release packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-android
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Inspect generated project
        run: |
          xcodebuild -version | tee "$GITHUB_STEP_SUMMARY"
          xcodebuild -list | tee -a "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 2 -type f -print | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ios

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          if ! xcodebuild \
            -project PhoneCheck.xcodeproj \
            -scheme PhoneCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        working-directory: ios

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneCheck.app build/Payload/
          cd build/Payload
          zip -qry ../PhoneCheck-unsigned.ipa .
          mv ../PhoneCheck-unsigned.ipa ../phone-check-ios-unsigned.ipa
        working-directory: ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-ios
          path: ios/build/phone-check-ios-unsigned.ipa
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-check-android
          path: artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-check-ios
          path: artifacts/ios

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.4
          name: v1.4
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/ios/*.ipa
