name: Build release packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-android
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Inspect generated project
        run: |
          xcodebuild -version | tee "$GITHUB_STEP_SUMMARY"
          xcodebuild -list | tee -a "$GITHUB_STEP_SUMMARY"
          find . -maxdepth 2 -type f -print | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: ios

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          if ! xcodebuild \
            -project PhoneCheck.xcodeproj \
            -scheme PhoneCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        working-directory: ios

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneCheck.app build/Payload/
          cd build/Payload
          zip -qry ../PhoneCheck-unsigned.ipa .
          mv ../PhoneCheck-unsigned.ipa ../phone-check-ios-unsigned.ipa
        working-directory: ios

      - name: Import signing assets
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.IOS_P12_PASSWORD != '' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$IOS_P12_BASE64" | base64 --decode > certificate.p12
          echo "$IOS_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -o - -)
          KEYCHAIN_PATH="$RUNNER_TEMP/phone-check.keychain"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
        working-directory: ios

      - name: Build signed iOS app
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.IOS_P12_PASSWORD != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if ! xcodebuild \
            -project PhoneCheck.xcodeproj \
            -scheme PhoneCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhoneCheck.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="${IOS_SIGNING_IDENTITY:-Apple Distribution}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" > build.log 2>&1; then
            tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
        working-directory: ios

      - name: Export signed IPA
        if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && secrets.IOS_P12_PASSWORD != '' }}
        env:
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${IOS_SIGNING_IDENTITY:-Apple Distribution}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.xq.phonecheck</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/PhoneCheck.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
          cp build/export/PhoneCheck.ipa build/phone-check-ios-signed.ipa
          rm -f build/phone-check-ios-unsigned.ipa
        working-directory: ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-ios
          path: ios/build/phone-check-ios-*.ipa
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          VERSION="$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-check-android
          path: artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-check-ios
          path: artifacts/ios

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/android/*.apk
            artifacts/ios/*.ipa
