name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-android
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Build unsigned iOS archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project PhoneCheck.xcodeproj \
            -scheme PhoneCheck \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PhoneCheck.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/PhoneCheck.xcarchive/Products/Applications/PhoneCheck.app build/Payload/
          cd build/Payload
          zip -qry ../PhoneCheck-unsigned.ipa .
          mv ../PhoneCheck-unsigned.ipa ../phone-check-ios-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-ios
          path: ios/build/phone-check-ios-unsigned.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/phone-check-android/*.apk \
            artifacts/phone-check-ios/*.ipa
