name: Build release packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_beta: ${{ steps.version.outputs.is_beta }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          BASE_VERSION="$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)"
          IS_BETA=false
          if git ls-remote --exit-code --tags origin "v${BASE_VERSION}" >/dev/null 2>&1; then
            if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
              IS_BETA=true
              BASE_VERSION="${BASE_VERSION}-beta-${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_beta=${IS_BETA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -PappVersion=${{ steps.version.outputs.version }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-check-android
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-check-android
          path: artifacts/android

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: v${{ needs.android.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.android.outputs.is_beta == 'true' }}
          files: |
            artifacts/android/*.apk
